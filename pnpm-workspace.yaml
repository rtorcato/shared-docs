# docs/site/ is the docs.torcato.dev index page, deployed on its own (private).
packages:
  # The root is the published package. Unlisted, Changesets cannot see it and
  # rejects every changeset as "not in the workspace".
  - '.'
  - docs/site

# Family packages skip the minimum-release-age gate — they're ours, so a fresh
# publish doesn't need to age before this repo can pick it up.
minimumReleaseAgeExclude:
  - '@rtorcato/*'

# Don't re-verify node_modules on every script run — the check costs a
# second per invocation and CI installs with --frozen-lockfile anyway.
verifyDepsBeforeRun: false

# CVE-2026-59870 (!!omap, fixed 4.3.1) and the maxTotalMergeKeys CPU bypass
# (Dependabot #2, fixed 4.3.2) — both CPU exhaustion parsing YAML. Reached only
# transitively (semantic-release → cosmiconfig → js-yaml ^4.1.0), and the fix
# ships on the `v4-legacy` dist-tag, which a plain `pnpm update` won't select.
# Drop this once cosmiconfig's range starts at 4.3.2.
#
# GHSA-8r5x-fm3f-whwj, GHSA-p8wg-vrv2-v86f (JS injection) and GHSA-xw65-4hp5-5hc7,
# fixed in handlebars 4.7.10 (semantic-release → conventional-changelog-writer).
# Dependabot's 7-day cooldown re-resolves the lockfile and rolled it back to
# 4.7.9 (#121), so pin the floor here.
overrides:
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
  handlebars@<4.7.10: 4.7.10
