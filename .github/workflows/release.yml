name: Release

# On demand only, never per merge: a dispatch (hotfix, ad hoc) or a closed
# milestone ("ship this batch"). Matches the repo-tooling preset.
on:
  workflow_dispatch:
  milestone:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  # Required for npm trusted publishing (OIDC) — without it GitHub mints no
  # token for the job and @semantic-release/npm falls back to NPM_TOKEN.
  id-token: write

jobs:
  # Is an approved release already publishing? Then this request must queue
  # behind it, not cancel it mid-publish. One still waiting for approval has
  # published nothing, so superseding that one is safe.
  in-flight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      publishing: ${{ steps.check.outputs.publishing }}
    steps:
      - name: 🔎 Check for a release already publishing
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publishing=false
          # A run waiting for approval is `waiting`, not `in_progress`.
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?status=in_progress" --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id"); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '.jobs[] | select(.status == "in_progress" and .name != "in-flight") | .name' | grep -q .; then
              publishing=true
            fi
          done
          echo "publishing=$publishing" >> "$GITHUB_OUTPUT"
          if [ "$publishing" = true ]; then
            echo "::notice::A release is already publishing; this one runs after it."
          fi

  release:
    needs: in-flight
    # Supersede a run still waiting for approval, never one publishing.
    concurrency:
      group: release
      cancel-in-progress: ${{ needs.in-flight.outputs.publishing != 'true' }}
    runs-on: ubuntu-latest
    # Must match the environment on the npm trusted publisher, or the OIDC
    # exchange fails with "404 package not found".
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          # The tip, not the event's SHA: the job starts after approval, and
          # semantic-release refuses a checkout the branch has moved past. A
          # dispatch releases the branch it ran from; a closed milestone
          # releases the default branch.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          fetch-depth: 0
          # semantic-release pushes the version bump and tag to main, and
          # GITHUB_TOKEN cannot push to a protected branch. RELEASE_TOKEN (an
          # admin PAT) is what makes that work once main is protected; the
          # fallback keeps releases green until the secret exists.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      # OIDC trusted publishing is done by the npm CLI, not by semantic-release
      # itself — and it needs npm >= 11.5.1. Node 22 ships npm 10.x, which
      # ignores the OIDC credentials semantic-release already exchanged and
      # fails the upload with ENEEDAUTH. Same fix api-common carries.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # No NPM_TOKEN: auth comes from the OIDC trusted publisher configured for
      # this package on npmjs.com. Setting it would send @semantic-release/npm
      # down the token path and fail verification if the token has expired.
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
