name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # Tests import dist/, so they run after the build.
      - run: pnpm test
      # dist/ is committed on purpose (git-dep consumers install prebuilt output),
      # so a rebuild that changes it means the committed copy is stale.
      - name: Check committed dist/ is up to date
        run: git diff --exit-code dist
